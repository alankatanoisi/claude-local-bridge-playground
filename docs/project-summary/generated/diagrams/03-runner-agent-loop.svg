<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1020" height="700" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Runner Agent Loop, Permission Gate &amp; Durability</text>
  <text x="24" y="56" font-size="12" fill="#64748b">src/runner/run.js — option resolution, context projection, tool pipeline, stop reasons, single idempotent finalizer</text>

  <!-- loop nodes -->
  <rect x="40" y="86" width="180" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="130" y="108" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">Prompt + context</text>
  <text x="130" y="125" font-size="10.5" text-anchor="middle" fill="#475569">system-prompt · templates</text>

  <rect x="260" y="86" width="200" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="360" y="108" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">Context projection</text>
  <text x="360" y="125" font-size="10.5" text-anchor="middle" fill="#475569">estimate · compact · anchor</text>

  <rect x="500" y="86" width="210" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="605" y="108" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">message-contract check</text>
  <text x="605" y="125" font-size="10.5" text-anchor="middle" fill="#475569">1 result per tool_use_id</text>

  <rect x="750" y="86" width="230" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="865" y="108" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">model-client → bridge</text>
  <text x="865" y="125" font-size="10.5" text-anchor="middle" fill="#475569">buffered or SSE · retry/backoff</text>

  <rect x="750" y="176" width="230" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="865" y="198" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">Model response</text>
  <text x="865" y="215" font-size="10.5" text-anchor="middle" fill="#475569">text + tool_use blocks</text>

  <rect x="470" y="176" width="240" height="54" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="590" y="198" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">permissions.js gate</text>
  <text x="590" y="215" font-size="10.5" text-anchor="middle" fill="#475569">allow / ask / deny / plan-only</text>

  <rect x="200" y="176" width="230" height="54" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="315" y="198" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">safety.js chokepoint</text>
  <text x="315" y="215" font-size="10.5" text-anchor="middle" fill="#475569">confinePath · deny matrix</text>

  <rect x="200" y="266" width="230" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="315" y="288" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">tool-pipeline.js</text>
  <text x="315" y="305" font-size="10.5" text-anchor="middle" fill="#475569">batch execute · failure streak</text>

  <rect x="470" y="266" width="240" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="590" y="288" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f172a">tool_result → next turn</text>
  <text x="590" y="305" font-size="10.5" text-anchor="middle" fill="#475569">redaction-boundary applied</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a3)">
    <line x1="220" y1="113" x2="256" y2="113"/>
    <line x1="460" y1="113" x2="496" y2="113"/>
    <line x1="710" y1="113" x2="746" y2="113"/>
    <line x1="865" y1="140" x2="865" y2="172"/>
    <line x1="750" y1="203" x2="714" y2="203"/>
    <line x1="470" y1="203" x2="434" y2="203"/>
    <line x1="315" y1="230" x2="315" y2="262"/>
    <line x1="430" y1="293" x2="466" y2="293"/>
    <path d="M710,293 L740,293 L740,340 L360,340 L360,144" />
  </g>
  <text x="742" y="336" font-size="10.5" fill="#475569">loop until end_turn or a stop reason fires</text>

  <!-- gates panel -->
  <rect x="40" y="366" width="470" height="150" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="388" font-size="12.5" font-weight="700" fill="#92400e">Layered authority (narrow-only)</text>
  <text x="56" y="410" font-size="11" fill="#78350f">authority.js — ceiling frozen from CLI flags before anything runs</text>
  <text x="56" y="428" font-size="11" fill="#78350f">tool-visibility.js — capability groups: core (default), edits, recovery,</text>
  <text x="56" y="444" font-size="11" fill="#78350f">agents, worktrees, skills, lsp; shell only via --allow-shell</text>
  <text x="56" y="462" font-size="11" fill="#78350f">--tools allowlist intersects, never widens · hard gates still apply</text>
  <text x="56" y="480" font-size="11" fill="#78350f">safety.js re-checks inside execute() (defence in depth)</text>
  <text x="56" y="498" font-size="11" fill="#78350f">Guardrails, not OS sandboxing — see docs/threat-model.md</text>

  <rect x="530" y="366" width="450" height="150" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="546" y="388" font-size="12.5" font-weight="700" fill="#3730a3">Durability quartet</text>
  <text x="546" y="410" font-size="11" fill="#312e81">session-store.js → *.state.json — debounced atomic checkpoint (75 ms)</text>
  <text x="546" y="428" font-size="11" fill="#312e81">session-ledger.js → *.ledger.jsonl — synchronous append-only event log</text>
  <text x="546" y="446" font-size="11" fill="#312e81">replay-simulator.js — read-only gap / pending-effect / orphan detection</text>
  <text x="546" y="464" font-size="11" fill="#312e81">ledger-repair.js — planRepair / applyRepair / reconcileForResume</text>
  <text x="546" y="484" font-size="11" fill="#312e81">Every tool call bracketed by tool_effect_intent / tool_effect_result</text>
  <text x="546" y="502" font-size="11" fill="#312e81">sharing one effectId, including on throw or deny</text>

  <!-- finalizer -->
  <rect x="40" y="536" width="940" height="140" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="56" y="558" font-size="12.5" font-weight="700" fill="#0f172a">finalizeRun() — single idempotent terminal path (all exits, incl. SIGINT and SIGTERM)</text>
  <g font-size="11" fill="#334155">
    <rect x="56" y="572" width="140" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="126" y="590" text-anchor="middle">terminal output</text><text x="126" y="604" text-anchor="middle" font-size="10">text/json/stream-json</text>
    <rect x="210" y="572" width="140" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="280" y="590" text-anchor="middle">trace event</text><text x="280" y="604" text-anchor="middle" font-size="10">flight recorder JSONL</text>
    <rect x="364" y="572" width="140" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="434" y="590" text-anchor="middle">transcript flush</text><text x="434" y="604" text-anchor="middle" font-size="10">+ human log</text>
    <rect x="518" y="572" width="140" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="588" y="590" text-anchor="middle">run_stopped</text><text x="588" y="604" text-anchor="middle" font-size="10">ledger event</text>
    <rect x="672" y="572" width="140" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="742" y="590" text-anchor="middle">autopsy</text><text x="742" y="604" text-anchor="middle" font-size="10">loop-autopsy.js</text>
    <rect x="826" y="572" width="140" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="896" y="590" text-anchor="middle">session persist</text><text x="896" y="604" text-anchor="middle" font-size="10">+ exit code</text>
  </g>
  <text x="56" y="636" font-size="11" fill="#475569">Stop reasons: end_turn · max steps · wall clock · cost / token budget · tool-call cap · repeated-failure halt · user abort</text>
  <text x="56" y="654" font-size="11" fill="#475569">Tool-error patience: 3 fully failed batches → foreground asks (continue guarded / add guidance / stop); non-interactive stops safely</text>
</svg>
