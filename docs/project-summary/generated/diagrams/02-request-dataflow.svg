<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="1020" height="700" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Request &amp; Credential Data Flow</text>
  <text x="24" y="56" font-size="12" fill="#64748b">One model call from the runner through the bridge to Anthropic, including OAuth discovery and the 401 retry path</text>

  <!-- lifelines -->
  <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#0f172a">
    <rect x="30" y="76" width="140" height="38" rx="7" fill="#eff6ff" stroke="#93c5fd"/><text x="100" y="100">Runner (run.js)</text>
    <rect x="196" y="76" width="140" height="38" rx="7" fill="#fefce8" stroke="#fcd34d"/><text x="266" y="100">server.js</text>
    <rect x="362" y="76" width="150" height="38" rx="7" fill="#fefce8" stroke="#fcd34d"/><text x="437" y="100">handlers/anthropic.js</text>
    <rect x="538" y="76" width="150" height="38" rx="7" fill="#fefce8" stroke="#fcd34d"/><text x="613" y="100">credentials.js</text>
    <rect x="714" y="76" width="130" height="38" rx="7" fill="#fefce8" stroke="#fcd34d"/><text x="779" y="100">proxy.js</text>
    <rect x="866" y="76" width="130" height="38" rx="7" fill="#fef2f2" stroke="#fca5a5"/><text x="931" y="100">Anthropic</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="100" y1="114" x2="100" y2="606"/>
    <line x1="266" y1="114" x2="266" y2="606"/>
    <line x1="437" y1="114" x2="437" y2="606"/>
    <line x1="613" y1="114" x2="613" y2="606"/>
    <line x1="779" y1="114" x2="779" y2="606"/>
    <line x1="931" y1="114" x2="931" y2="606"/>
  </g>

  <g font-size="10.5" fill="#334155">
    <line x1="100" y1="146" x2="262" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="104" y="140">1. POST /v1/messages (+ optional caller Bearer, trace headers)</text>

    <line x1="266" y1="184" x2="433" y2="184" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="270" y="178">2. caller-auth / local-auth gate, route dispatch</text>

    <line x1="437" y1="222" x2="609" y2="222" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="441" y="216">3. resolveModel(), default max_tokens, getCredentials(ctx)</text>

    <rect x="470" y="238" width="300" height="96" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="482" y="256" font-weight="700" fill="#0f172a">Credential priority chain (OAuth only)</text>
    <text x="482" y="272">① live intercepted Claude Code Bearer token</text>
    <text x="482" y="287">② CLAUDE_CODE_OAUTH_TOKEN env var</text>
    <text x="482" y="302">③ macOS Keychain "Claude Code-credentials"</text>
    <text x="482" y="317">④ ~/.claude/.credentials.json</text>
    <text x="482" y="330" font-style="italic" fill="#b91c1c">x-api-key / ANTHROPIC_API_KEY are ignored</text>

    <line x1="613" y1="356" x2="441" y2="356" stroke="#0d9488" stroke-width="1.5" marker-end="url(#a2r)"/>
    <text x="445" y="350" fill="#0f766e">4. { accessToken, source } — cached w/ TTL + rotation watermark</text>

    <line x1="437" y1="392" x2="775" y2="392" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="441" y="386">5. prependClaudeCodeSystem(): billing + agent-identity blocks, cache_control 1h</text>

    <rect x="640" y="404" width="356" height="60" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="652" y="422" font-weight="700" fill="#78350f">buildAdaptiveAuthHeaders() — fingerprint.js</text>
    <text x="652" y="437">replay STABLE identity headers only (user-agent, x-stainless-*)</text>
    <text x="652" y="452">strip request-specific + request-shape beta flags (P1-06)</text>

    <line x1="779" y1="486" x2="927" y2="486" stroke="#334155" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="700" y="480">6. authorization: Bearer …</text>

    <line x1="931" y1="518" x2="783" y2="518" stroke="#0d9488" stroke-width="1.5" marker-end="url(#a2r)"/>
    <text x="790" y="512" fill="#0f766e">7. SSE / JSON</text>

    <line x1="779" y1="560" x2="104" y2="560" stroke="#0d9488" stroke-width="1.5" marker-end="url(#a2r)"/>
    <text x="300" y="554" fill="#0f766e">8. streamed straight through — status + rate-limit headers forwarded verbatim, no buffering</text>
  </g>

  <!-- 401 path -->
  <rect x="30" y="586" width="966" height="88" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="608" font-size="12.5" font-weight="700" fill="#b91c1c">401 recovery path (proxy.js)</text>
  <text x="46" y="628" font-size="11" fill="#7f1d1d">a. markCredentialsRejected() quarantines the rejected intercepted token so the retry cannot re-select it</text>
  <text x="46" y="645" font-size="11" fill="#7f1d1d">b. clearCredentialsCache() forces fresh discovery · c. retry exactly once, before any client headers are committed</text>
  <text x="46" y="662" font-size="11" fill="#7f1d1d">d. still failing → 401 surfaces to the caller; operator runs `claude /login` and the interceptor captures the refreshed token</text>
</svg>
